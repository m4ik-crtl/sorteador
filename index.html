<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador | Modo Verde</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body class="dark-mode"> <div class="background-mesh"></div>

    <div class="theme-switcher">
        <button id="theme-toggle" aria-label="Alternar tema">
            <i class="fas fa-moon"></i>
            <i class="fas fa-sun"></i>
        </button>
    </div>

    <div class="container">
        <div class="logo-icon">
            <i class="fas fa-dice-d20"></i>
        </div>
        <h1>Sorteador</h1>
        
        <div class="input-section">
            <textarea id="nameInput" placeholder="Digite os nomes, separados por vírgula ou quebra de linha..."></textarea>
            <div id="participants-list-container">
                <p>Participantes Adicionados:</p>
                <div id="participants-list"></div>
            </div>
            <button id="addBtn"><i class="fas fa-plus"></i> Adicionar</button>
            <button id="drawBtn" class="primary-btn"><i class="fas fa-bolt"></i> Sortear</button>
            <button id="clearBtn" class="secondary-btn"><i class="fas fa-trash-can"></i> Limpar Tudo</button>
        </div>

        <div class="result-section">
            <div id="countdown" class="countdown"></div>
            <div id="winner" class="result"></div>
            <hr class="result-divider">
            <div class="action-buttons">
                <button id="orderBtn"><i class="fas fa-ranking-star"></i> Mostrar Ranking</button>
                <button id="downloadBtn"><i class="fas fa-file-code"></i> Baixar Resultado</button>
                <button id="restartBtn" class="secondary-btn"><i class="fas fa-rotate-right"></i> Novo Sorteio</button>
            </div>
        </div>
    </div>

    <div id="rankingModal" class="modal-overlay">
        <div class="modal-content">
            <button id="modalCloseBtn" class="modal-close">&times;</button>
            <h2>Ranking Completo</h2>
            <ul id="rankingListModal"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
